name: Archify Diagram

on:
  workflow_dispatch:
    inputs:
      diagram_type:
        description: Diagram type
        required: true
        default: architecture
        type: choice
        options:
          - architecture
          - workflow
          - sequence
          - dataflow
          - lifecycle
      input_file:
        description: JSON input file path
        required: true
        default: diagrams/architecture.json
        type: string
      quality:
        description: Validation quality profile
        required: true
        default: showcase
        type: choice
        options:
          - standard
          - showcase
  push:
    branches: [main]
    paths:
      - 'diagrams/**/*.json'
      - '.github/workflows/archify-diagram.yml'
  pull_request:
    paths:
      - 'diagrams/**/*.json'
      - '.github/workflows/archify-diagram.yml'

permissions:
  contents: read

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: archify/package-lock.json

      - name: Install Archify dependencies
        run: npm ci
        working-directory: archify

      - name: Validate and render diagrams
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          INPUT_TYPE: ${{ inputs.diagram_type }}
          INPUT_FILE: ${{ inputs.input_file }}
          INPUT_QUALITY: ${{ inputs.quality }}
        run: |
          set -euo pipefail
          mkdir -p generated

          render_one() {
            local input_file="$1"
            local forced_type="${2:-}"
            local forced_quality="${3:-}"

            if [[ ! -f "$input_file" ]]; then
              echo "::error::Input file not found: $input_file"
              exit 2
            fi
            if [[ "$input_file" != *.json ]]; then
              echo "::error::Input file must end in .json: $input_file"
              exit 2
            fi

            local diagram_type
            local quality
            diagram_type="${forced_type:-$(node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.stdout.write(String(d.diagram_type||""));' "$input_file")}"
            quality="${forced_quality:-$(node -e 'const fs=require("fs"); const d=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); process.stdout.write(String(d.meta?.quality_profile||"standard"));' "$input_file")}"

            case "$diagram_type" in
              architecture|workflow|sequence|dataflow|lifecycle) ;;
              *) echo "::error::Unsupported diagram type '$diagram_type' in $input_file"; exit 2 ;;
            esac
            case "$quality" in
              standard|showcase) ;;
              *) echo "::error::Unsupported quality '$quality' in $input_file"; exit 2 ;;
            esac

            local relative="${input_file#diagrams/}"
            local stem="${relative%.json}"
            local output_file="generated/${stem}.html"
            mkdir -p "$(dirname "$output_file")"

            echo "Rendering $input_file -> $output_file ($diagram_type / $quality)"
            node archify/bin/archify.mjs validate "$diagram_type" "$input_file" --quality "$quality" --json
            node archify/bin/archify.mjs deliver "$diagram_type" "$input_file" "$output_file" --quality "$quality" --json
            node archify/bin/archify.mjs check "$output_file"
          }

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            render_one "$INPUT_FILE" "$INPUT_TYPE" "$INPUT_QUALITY"
          else
            mapfile -t files < <(find diagrams -type f -name '*.json' -print | sort)
            if [[ ${#files[@]} -eq 0 ]]; then
              echo '::error::No diagram JSON files found under diagrams/'
              exit 2
            fi
            for file in "${files[@]}"; do
              render_one "$file"
            done
          fi

      - name: Upload generated diagrams
        uses: actions/upload-artifact@v4
        with:
          name: archify-diagrams-${{ github.run_number }}
          path: generated/**/*.html
          if-no-files-found: error
          retention-days: 14
